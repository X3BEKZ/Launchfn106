<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LaunchFn106 - Custom Game Launcher</title>
    <style>
        :root {
            --red-primary: #e50914;
            --red-hover: #ff1e27;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }

        body {
            background: #0d0d0d url('bg_processed-copy.png') no-repeat center center fixed;
            background-size: cover;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Dark overlay for contrast */
        .overlay {
            background: radial-gradient(circle, rgba(0,0,0,0.4) 0%, rgba(10,10,12,0.9) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Top Navigation Header */
        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2.5rem 5% 0;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 36px;
            height: 36px;
            object-fit: contain;
        }

        .logo span {
            color: var(--red-primary);
        }

        /* Hero Section - Fully Centered */
        .hero {
            max-width: 800px;
            margin: auto;
            text-align: center;
            padding: 2rem 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .badge {
            display: inline-block;
            background: rgba(229, 9, 20, 0.15);
            border: 1px solid var(--red-primary);
            color: var(--red-primary);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 1.2rem;
            text-shadow: 0 4px 20px rgba(0,0,0,0.8);
        }

        p.subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            max-width: 620px;
            line-height: 1.6;
        }

        /* Download Button */
        .cta-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: var(--red-primary);
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: 700;
            padding: 1rem 2.5rem;
            border-radius: 8px;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.4);
        }

        .cta-btn:hover {
            background: var(--red-hover);
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(229, 9, 20, 0.7);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="overlay">
        <!-- Header Logo with Icon -->
        <nav>
            <a href="#" class="logo">
                <img src="Launcherfn106ICON-copy.ico" alt="LaunchFn106 Icon" class="logo-img">
                LAUNCHFN106
            </a>
        </nav>

        <!-- Main Hero Content -->
        <main class="hero">
            <span class="badge">Desktop Game Launcher</span>
            <h1>Organize Your Game Library Your Way</h1>
            <p class="subtitle">A clean, lightweight launcher designed in my free time. Add custom shortcuts, manage posters, and track your game time.</p>
            
            <a href="main.zip" class="cta-btn" download>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download LaunchFn106
            </a>
        </main>

        <!-- Footer -->
        <footer>
            &copy; 2026 LaunchFn106. All rights reserved.
        </footer>
    </div>
</body>
</html>
